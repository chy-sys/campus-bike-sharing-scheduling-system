server:
  port: 8001

spring:
  application:
    name: bike-server
  # 数据库连接
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bike_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.gxu.bike.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 开启 SQL 日志打印，方便调试
    global-config:
      db-config:
        id-type: auto

# JWT配置（不配置则使用 JwtUtil 中的默认值）
jwt:
  secret: gxu_bike_secret_key_2026
  expiration: 86400000
